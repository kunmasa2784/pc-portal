                purpose: "自分で作った句や短歌をAIに見せて、別の表現方法や季語の確認などのアドバイスをもらいます。",
                prompt: "趣味で川柳を作りました。『孫が来て 部屋がにぎやか 孫帰り』。この句の面白さを活かしつつ、さらに別の表現や情景が浮かぶ言い換えの案を2つ提示してください。",
                point: "ゼロから作らせるのではなく、自分が作ったものを「一緒に磨き上げる壁打ち相手」として使う楽しさを伝えます。",

            {
                id: 20,
                catId: "community",
                category: "4. 家族・地域との絆と趣味の広がり",
                title: "⑳ 孫や若い世代との会話のきっかけ・トレンド質問",
                purpose: "若い世代で流行している言葉や趣味についてAIに聞き、家族との会話のネタにします。",
                prompt: "最近、中学生の孫が『推し活（おしかつ）』という言葉をよく使っています。シニアにも分かるように、どういう意味か簡単に教えてください。また、孫と会話するときに使える話題も教えてください。",
                point: "「AIを聞き相手にして新しい知識を得る」という、生活の知的好奇心を満たす使い方を提案できます。",
                hint: "「70代の祖父母から『〇〇って聞いたよ』と自然に切り出すときの第一声のセリフ案を考えて」と具体的に頼むと会話が弾みます。"
            }

        // カテゴリ定義
        const categories = [
            { id: "all", name: "すべての活用例", icon: "fa-border-all", count: 20 },
            { id: "health", name: "1. 健康と暮らしの安心", icon: "fa-heart-pulse", count: 5 },
            { id: "organize", name: "2. 身の回り整理・手続き", icon: "fa-folder-open", count: 5 },
            { id: "life", name: "3. おでかけ・買い物の知恵", icon: "fa-cart-shopping", count: 5 },
            { id: "community", name: "4. 絆と趣味・昭和の記録", icon: "fa-comments", count: 5 }
        ];

        // 状態管理
        let activeCategory = "all";
        let searchQuery = "";
        let expandedCategory = null; // 初期状態はすべて閉じた状態

        // 初期化
        window.onload = function() {
            renderCategories();
            renderPrompts();
            setupEventListeners();
        };

        // カテゴリナビの描画（初期状態はすべて折りたたみ）
        function renderCategories() {
            const nav = document.getElementById("categoryNav");
            nav.innerHTML = categories.map(cat => {
                const isActive = cat.id === activeCategory;
                const isExpanded = cat.id === expandedCategory;
                const activeClass = isActive 
                    ? "bg-moss-600 text-white font-bold shadow-md" 
                    : "text-moss-200 hover:bg-moss-800 hover:text-white";
                
                // 該当カテゴリに属するプロンプト一覧を取得（"all"以外）
                const categoryPrompts = cat.id === "all" 
                    ? [] 
                    : promptsData.filter(p => p.catId === cat.id);

                const hasSubItems = cat.id !== "all" && categoryPrompts.length > 0;

                return `
                    <div class="mb-1">
                        <button onclick="selectCategory('${cat.id}')" class="w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-center justify-between transition ${activeClass}">
                            <div class="flex items-center gap-2.5 truncate">
                                <i class="fa-solid ${cat.icon} w-5 text-center text-moss-300"></i>
                                <span class="truncate">${cat.name}</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <span class="text-xs px-2 py-0.5 rounded-full ${isActive ? 'bg-moss-800 text-white' : 'bg-moss-950/40 text-moss-300'} font-semibold">${cat.count}</span>
                                ${hasSubItems ? `<i class="fa-solid fa-chevron-down text-[10px] text-moss-300 transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}"></i>` : ''}
                            </div>
                        </button>

                        <!-- カテゴリ傘下のプロンプト項目リスト（アコーディオン） -->
                        ${hasSubItems ? `
                            <div class="mt-1 ml-3 pl-3 border-l-2 border-moss-700/60 space-y-0.5 ${isExpanded ? 'block' : 'hidden'}">
                                ${categoryPrompts.map(p => `
                                    <button onclick="scrollToPrompt(${p.id})" class="w-full text-left px-2 py-1.5 rounded text-xs text-moss-300 hover:text-white hover:bg-moss-800/80 transition flex items-center justify-between group">
                                        <span class="truncate group-hover:translate-x-0.5 transition-transform">${p.title}</span>
                                        <i class="fa-solid fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 text-moss-400"></i>
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // プロンプトカード一覧のレンダリング関数
        function renderPrompts() {
            const container = document.getElementById("promptsContainer");
            const noResults = document.getElementById("noResults");
            const currentCategoryTitle = document.getElementById("currentCategoryTitle");
            const itemCountBadge = document.getElementById("itemCountBadge");

            if (!container) return;

            // 現在選択中のカテゴリタイトル表示の更新
            const currentCatObj = categories.find(c => c.id === activeCategory);
            if (currentCatObj && currentCategoryTitle) {
                currentCategoryTitle.textContent = currentCatObj.name;
            }

            // フィルタリング処理（カテゴリ選択 & 検索キーワード）
            const filtered = promptsData.filter(item => {
                const matchCategory = (activeCategory === "all") || (item.catId === activeCategory);
                const query = searchQuery.toLowerCase();
                const matchSearch = query === "" || 
                    item.title.toLowerCase().includes(query) ||
                    item.purpose.toLowerCase().includes(query) ||
                    item.prompt.toLowerCase().includes(query) ||
                    item.point.toLowerCase().includes(query) ||
                    item.hint.toLowerCase().includes(query);

                return matchCategory && matchSearch;
            });

            // 件数バッジの更新
            if (itemCountBadge) {
                itemCountBadge.textContent = `${filtered.length}件表示`;
            }

            // 該当結果なしの制御
            if (filtered.length === 0) {
                container.innerHTML = "";
                if (noResults) noResults.classList.remove("hidden");
                return;
            } else {
                if (noResults) noResults.classList.add("hidden");
            }

            // プロンプトカード HTML の生成と挿入
            container.innerHTML = filtered.map(item => `
                <div id="prompt-card-${item.id}" class="bg-white rounded-2xl shadow-sm border border-moss-200/80 p-5 md:p-6 transition-all duration-300 hover:shadow-md">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="bg-moss-100 text-moss-800 text-xs font-bold px-3 py-1 rounded-full border border-moss-200">
                            ${escapeHtml(item.category)}
                        </span>
                        <button onclick="copyToClipboard(${item.id})" class="copy-btn-${item.id} bg-moss-600 hover:bg-moss-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-sm flex items-center gap-1.5 active:scale-95">
                            <i class="fa-regular fa-copy"></i>
                            <span>プロンプトをコピー</span>
                        </button>
                    </div>

                    <h3 class="font-bold text-moss-900 text-lg md:text-xl mb-2 flex items-center gap-2">
                        ${escapeHtml(item.title)}
                    </h3>

                    <p class="text-moss-700 text-sm mb-4 leading-relaxed">
                        <strong class="text-moss-900 font-semibold">💡 目的:</strong> ${escapeHtml(item.purpose)}
                    </p>

                    <!-- プロンプト表示エリア -->
                    <div class="prompt-box p-4 rounded-xl mb-4 relative group">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-moss-800 flex items-center gap-1">
                                <i class="fa-solid fa-terminal text-moss-600"></i> AIへのプロンプト例（指示文）:
                            </span>
                            <button onclick="copyToClipboard(${item.id})" class="copy-btn-${item.id} text-moss-600 hover:text-moss-800 text-xs font-semibold flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> コピー
                            </button>
                        </div>
                        <pre class="whitespace-pre-wrap font-sans text-sm text-moss-900 leading-relaxed tracking-wide select-all">${escapeHtml(item.prompt)}</pre>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <!-- 指導ポイント -->
                        <div class="bg-moss-50/70 p-3.5 rounded-xl border border-moss-200/60">
                            <p class="font-bold text-moss-800 mb-1 flex items-center gap-1.5">
                                <i class="fa-solid fa-graduation-cap text-moss-600"></i> ポイント:
                            </p>
                            <p class="text-moss-700 leading-relaxed">${escapeHtml(item.point)}</p>
                        </div>

                        <!-- 発展形ヒント -->
                        <div class="hint-box p-3.5 rounded-xl">
                            <p class="font-bold text-amberAccent-700 mb-1 flex items-center gap-1.5">
                                <i class="fa-solid fa-lightbulb text-amberAccent-500"></i> 発展形・一工夫ヒント:
                            </p>
                            <p class="text-moss-800 leading-relaxed">${escapeHtml(item.hint)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // サイドパネルから指定プロンプトへジャンプ
        function scrollToPrompt(id) {
            const item = promptsData.find(p => p.id === id);
            if (!item) return;

            // 検索ワードをリセットして全件表示対象にする
            if (searchQuery !== "") {
                searchQuery = "";
                document.getElementById("searchInput").value = "";
            }

            // 対象カテゴリを選択状態かつ展開状態にする
            activeCategory = item.catId;
            expandedCategory = item.catId;
            renderCategories();
            renderPrompts();

            // DOM描画後にスムーズスクロール＆ハイライト演出
            setTimeout(() => {
                const el = document.getElementById(`prompt-card-${id}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    // 一時的なアテンション（枠線強調）演出
                    el.classList.add('ring-4', 'ring-amberAccent-500', 'border-amberAccent-500');
                    setTimeout(() => {
                        el.classList.remove('ring-4', 'ring-amberAccent-500', 'border-amberAccent-500');
                    }, 2000);
                }
            }, 50);
        }

        // カテゴリ切り替え（トグル開閉対応）
        function selectCategory(catId) {
            activeCategory = catId;
            if (catId === "all") {
                expandedCategory = null; // すべて表示の時は展開しない
            } else {
                // 同じカテゴリを再度押した場合は閉じる、別の場合は展開
                expandedCategory = (expandedCategory === catId) ? null : catId;
            }
            renderCategories();
            renderPrompts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // クリップボードコピー処理 (iFrame対応の安全なフォールバック付き)
        function copyToClipboard(id) {
            const promptObj = promptsData.find(p => p.id === id);
            if (!promptObj) return;

            const textToCopy = promptObj.prompt;
            let success = false;

            // 一時テキストエリアを使用した確実なコピー
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                success = document.execCommand('copy');
            } catch (err) {
                console.error('Copy command failed', err);
            }
            document.body.removeChild(textArea);

            if (success) {
                showToast();
                // ボタン表示を一時的に変更
                const btns = document.querySelectorAll(`.copy-btn-${id}`);
                btns.forEach(btn => {
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> 完了！`;
                    btn.classList.remove('bg-moss-600', 'hover:bg-moss-700');
                    btn.classList.add('bg-amberAccent-600', 'hover:bg-amberAccent-700');
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.classList.remove('bg-amberAccent-600', 'hover:bg-amberAccent-700');
                        btn.classList.add('bg-moss-600', 'hover:bg-moss-700');
                    }, 2000);
                });
            }
        }

        // トースト通知表示
        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.remove("translate-y-20", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");
            setTimeout(() => {
                toast.classList.remove("translate-y-0", "opacity-100");
                toast.classList.add("translate-y-20", "opacity-0");
            }, 3000);
        }

        // イベントリフォーマット用HTMLエスケープ
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // イベントリスナー設定
        function setupEventListeners() {
            // 検索入力
            document.getElementById("searchInput").addEventListener("input", (e) => {
                searchQuery = e.target.value.trim();
                renderPrompts();
            });
        }

        // フィルターリセット
        function resetFilters() {
            activeCategory = "all";
            searchQuery = "";
            document.getElementById("searchInput").value = "";
            renderCategories();
            renderPrompts();
        }

        // 文字サイズ切り替え機能
        function setTextSize(size) {
            const content = document.getElementById("contentArea");
            content.classList.remove("text-size-standard", "text-size-large", "text-size-xlarge");
            
            if (size === 'large') {
                content.classList.add("text-size-large");
            } else if (size === 'xlarge') {
                content.classList.add("text-size-xlarge");
            } else {
                content.classList.add("text-size-standard");
            }

            // ボタンアクティブ状態更新
            ['Std', 'Lg', 'Xl'].forEach(type => {
                const btn = document.getElementById(`btnText${type}`);
                if (btn) {
                    if ((type === 'Std' && size === 'standard') || 
                        (type === 'Lg' && size === 'large') || 
                        (type === 'Xl' && size === 'xlarge')) {
                        btn.className = "px-2 py-1 rounded bg-moss-600 text-white transition font-bold";
                    } else {
                        btn.className = "px-2 py-1 rounded text-moss-200 hover:text-white transition";
                    }
                }
            });
        }
    </script>

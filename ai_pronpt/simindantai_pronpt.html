<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動団体向けプロンプト集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .prompt-hint {
            border-left: 3px solid #6366f1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Header for Mobile -->
        <header class="md:hidden bg-white shadow-md p-4 sticky top-0 z-20">
            <h1 class="text-xl font-bold text-slate-700">活動団体プロンプト集</h1>
            <p class="text-sm text-slate-500">市民活動にAIの力を</p>
        </header>

        <!-- Sidebar -->
        <aside class="w-full md:w-72 bg-white md:border-r border-slate-200 p-4 md:p-6 md:sticky md:top-0 md:h-screen overflow-y-auto">
            <div class="hidden md:block mb-8">
                <h1 class="text-2xl font-bold text-slate-800">市民活動団体<br>プロンプト集</h1>
                <p class="text-sm text-slate-500">AI活用で活動を加速</p>
            </div>
            <nav>
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">カテゴリー</h2>
                <ul id="category-menu" class="space-y-1">
                    <!-- Categories will be inserted here by JS -->
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-10">
            <div id="prompt-container" class="max-w-4xl mx-auto">
                <!-- Prompts will be displayed here -->
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white py-2 px-4 rounded-lg shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none">
        コピーしました！
    </div>

    <script>
        // --- Prompt Data ---
        const prompts = {
            "はじめに": [
                {
                    type: "default",
                    title: "ようこそ！このプロンプト集の使い方",
                    description: "このプロンプト集は、市民活動団体の皆さまが生成AIを日々の活動に役立てるための具体的な活用例を集めたものです。左のメニューからカテゴリーを選び、あなたの課題に合ったプロンプトを見つけてください。「コピー」ボタンを押してAIに貼り付け、[ ] の部分をあなたの情報に書き換えるだけで、すぐに使えます。",
                    prompt: "",
                    hint: "各プロンプトには「良い結果を得るためのヒント」を記載しています。AIに、より質の高い回答を生成させるためのコツとしてご活用ください。"
                }
            ],
            "①組織の基盤づくり": [
                {
                    type: "default",
                    title: "団体のミッション・ビジョンを練り直す",
                    description: "団体の存在意義や目指す未来を言語化し、活動の軸を再確認します。メンバーの想いを一つにするためのワークショップのたたき台としても活用できます。",
                    prompt: "私たちの団体は、[例：地域の高齢者の孤立]という社会課題の解決を目指しています。\n\n# 団体の現状\n- 設立経緯：[例：代表の祖母が孤立していた経験から]\n- 現在の主な活動：[例：週一回のサロン運営、配食サービス]\n- 団体の強み：[例：地域住民とのネットワーク、長年の信頼]\n\n上記を踏まえ、私たちの活動の根幹となる「ミッション（果たすべき使命）」と、5年後の理想の姿を示す「ビジョン」を、それぞれ3案ずつ、心に響く言葉で提案してください。",
                    hint: "団体の設立経緯や、活動を通じて大切にしている価値観を具体的に伝えることで、より団体らしいミッション・ビジョンの案が生まれます。"
                },
                {
                    type: "default",
                    title: "活動の魅力を伝える「事業計画書」の骨子作成",
                    description: "団体の活動全体を分かりやすく整理し、支援者や行政にも伝わる事業計画書の骨子を作成します。",
                    prompt: "私たちのNPO法人の次年度事業計画書の骨子を作成してください。\n\n# 団体情報\n- ミッション：[団体のミッションを記入]\n- 主な活動分野：[例：子どもの貧困対策、環境保全など]\n\n# 計画の骨子に含めてほしい項目\n1.  はじめに（社会背景と団体の役割）\n2.  前期の活動総括と課題\n3.  次年度の事業目標（定量的・定性的な目標）\n4.  具体的な事業内容（3〜5つの柱に整理して）\n5.  推進体制（役員、職員、ボランティアの役割）\n6.  予算計画の概要\n\n上記の項目に沿って、説得力のある構成案を作成してください。",
                    hint: "前期の活動で得られた具体的な成果（参加人数、アンケートの声など）や、直面している課題を明確に記述すると、計画の説得力が増します。"
                },
                {
                    type: "default",
                    title: "団体の現状分析（SWOT分析）",
                    description: "団体の現状を「強み」「弱み」「機会」「脅威」の4つの観点から客観的に分析し、今後の戦略立案に役立てます。",
                    prompt: "私たちの団体について、SWOT分析を行ってください。\n\n# 団体情報\n- 団体名：[団体名]\n- 活動内容：[例：外国にルーツを持つ子どもたちへの学習支援]\n- 運営状況：[例：設立5年目、ボランティア15名、年間予算200万円]\n\n# 分析の観点\n- 強み (Strengths)：団体の内部にある長所や得意なこと\n- 弱み (Weaknesses)：団体の内部にある短所や苦手なこと\n- 機会 (Opportunities)：団体の外部にある追い風やチャンス\n- 脅威 (Threats)：団体の外部にある向かい風やリスク\n\n上記の情報に基づき、具体的な分析結果と、それらを基にした「クロスSWOT分析（強みを活かして機会を掴む戦略など）」による戦略の方向性を提案してください。",
                    hint: "運営状況について、メンバー構成（年代、スキル）、資金源（会費、寄付、助成金）、地域での評判などを加えると、より多角的な分析が可能になります。"
                },
                {
                    type: "default",
                    title: "新任理事・監事向けオリエンテーション資料の作成",
                    description: "新しく役員になった方が、役割と責任を理解し、スムーズに活動に参加できるための資料を作成します。",
                    prompt: "私たちのNPO法人で、新しく理事・監事に就任した方向けのオリエンテーション資料を作成したいです。以下の内容を盛り込んだ、分かりやすい資料の構成案と各項目のポイントを教えてください。\n\n# 資料に含める内容\n- 団体のミッション、ビジョン、沿革\n- 定款と主要な規程\n- NPO法における役員の役割と法的責任（善管注意義務など）\n- 団体の組織図と意思決定プロセス\n- 今年度の事業計画と予算\n- 主要な会議（理事会など）の年間スケジュール",
                    hint: "専門用語を避け、平易な言葉で説明するように依頼すると、法律や会計に詳しくない方にも分かりやすい資料になります。"
                },
                {
                    type: "default",
                    title: "団体の行動規範（Code of Conduct）を作成する",
                    description: "メンバー全員が気持ちよく活動できるよう、倫理観や行動の指針を明文化し、トラブルを未然に防ぎます。",
                    prompt: "私たちのNPO法人は、[例：子ども支援]を行っています。メンバーやボランティアが活動する上で遵守すべき「行動規範」を作成したいです。以下の点を盛り込んだ、私たちの団体にふさわしい行動規範の案を作成してください。\n\n# 含めたい項目\n- 人権の尊重と多様性への配慮\n- 個人情報の適切な取り扱い\n- 利益相反の防止\n- ハラスメントの禁止\n- 団体内外でのコミュニケーションにおける心構え",
                    hint: "団体の理念や活動内容を伝えることで、より活動の実態に即した行動規範を作成できます。"
                }
            ],
            "②広報": [
                {
                    type: "default",
                    title: "SNSで活動の魅力を伝える投稿文を作成する",
                    description: "FacebookやInstagramなどで、人々の共感を呼び「いいね！」やシェアを促すような投稿文のアイデアを作成します。",
                    prompt: "私たちの団体は「[活動内容]」をしています。この活動の様子を伝えるための、Facebook投稿文を3パターン作成してください。ターゲットは[例：30代の女性]です。写真に添える、読み手の心を掴むようなキャッチーな文章をお願いします。#ハッシュタグ の提案もしてください。",
                    hint: "投稿に使う予定の写真を具体的に説明すると（例：「子どもたちの笑顔の写真」）、より写真に合った投稿文が生成されます。"
                },
                {
                    type: "default",
                    title: "活動報告会のための魅力的なプレゼンテーション構成案",
                    description: "支援者や関係者に向けて、1年間の活動成果を分かりやすく、感動的に伝えるためのプレゼンテーションの構成案を作成します。",
                    prompt: "今度開催する活動報告会で、[15分間]のプレゼンテーションを行います。テーマは「[この1年間の活動成果と今後の展望]」です。支援者が「応援してきて良かった」と感じられるような、感動的で分かりやすいプレゼンテーションの構成案（スライドごとのタイトルと話す内容の要点）を作成してください。",
                    hint: "「最も印象的だったエピソード」や「活動を通じて得られた具体的な数字」を盛り込むと、ストーリーに深みと説得力が出ます。"
                },
                {
                    type: "default",
                    title: "メディアに取り上げられるためのプレスリリースを作成する",
                    description: "新しいイベントや活動の成果を、地域の新聞やWebメディアにニュースとして取り上げてもらうためのプレスリリースを作成します。",
                    prompt: "私たちの団体が[日付]に行うイベント「[イベント名]」について、メディア向けのプレスリリースを作成してください。\n\n# イベント概要\n- [イベントの目的、内容、日時、場所などを簡潔に]\n\n# プレスリリースに含める要素\n- 読者の興味を引くキャッチーなタイトル\n- 記事の要点（5W1H）\n- 社会的な背景やイベントの新規性\n- 代表者のコメント\n- 団体概要と問い合わせ先\n\n記者が記事を書きやすいように、客観的な事実を元に作成してください。",
                    hint: "なぜこのイベントが「ニュース」として価値があるのか（社会性、新規性、意外性など）を明確に伝えることが重要です。"
                },
                {
                    type: "default",
                    title: "年間広報計画の策定",
                    description: "行き当たりばったりではない、戦略的な情報発信を行うための年間の広報計画の骨子を作成します。",
                    prompt: "私たちの団体のための、年間広報計画の骨子を提案してください。\n\n# 団体情報\n- 活動内容：[例：里山保全活動]\n- 広報の目的：[例：新規ボランティアの獲得、認知度向上]\n- 主な情報発信ツール：[例：ウェブサイト、Facebook、地域の広報誌]\n\n# 計画の形式\n- 時期（四半期ごとなど）、広報テーマ、具体的なアクション、ターゲット、KPI（目標指標）を盛り込んだ表形式で作成してください。\n\n例：\n- 4-6月：春の活動シーズン開始！ -> 新規ボランティア募集キャンペーン -> Facebookでの活動紹介投稿強化 -> 「いいね」数、新規参加者数\n\n上記を参考に、私たちの団体に合った年間の広報計画を作成してください。",
                    hint: "団体の主要なイベント（総会、周年記念、メイン事業など）の時期を伝えると、それに合わせた効果的な広報計画を立てることができます。"
                },
                {
                    type: "default",
                    title: "メディア向け「ファクトブック」の作成",
                    description: "新聞やテレビなどのメディアが取材しやすいように、団体の基本情報や実績をまとめた資料（ファクトブック）を作成します。",
                    prompt: "メディア関係者向けの「ファクトブック」を作成したいです。記者が記事を書きやすいように、私たちの団体に関する情報をまとめる手伝いをしてください。\n\n# 団体情報\n- 団体名：[団体名]\n- 活動概要：[活動内容を簡潔に]\n- 設立年、代表者名、連絡先\n\n# ファクトブックに含める情報\n- 団体のミッション・ビジョン\n- 解決しようとしている社会課題の背景（統計データなど）\n- これまでの主な活動実績（具体的な数字を交えて）\n- 代表やメンバーのプロフィールと活動への想い\n- 高画質で提供できる写真のリスト\n\nこれらの情報を基に、メディアが引用しやすいように客観的な事実を中心に構成してください。",
                    hint: "社会課題の深刻さを示す公的な統計データや、活動の成果を示す具体的な数字（〇人の子どもを支援、〇トンの食料を配布など）を入れると、記事化される可能性が高まります。"
                }
            ],
            "③資金調達": [
                {
                    type: "default",
                    title: "助成金申請書の「事業の必要性」を強化する",
                    description: "審査員の心に響き、採択の可能性を高める助成金申請書のロジックを組み立てます。",
                    prompt: "現在、[〇〇財団]の助成金に申請する準備をしています。申請事業「[事業名]」について、審査員を納得させるための「事業の必要性」のパートを作成してください。\n\n# 事業概要\n- 目的：[事業を通じて解決したい課題]\n- 内容：[具体的な活動内容]\n- 対象者：[支援の対象となる人々]\n\n# 含めてほしい論点\n- なぜ「今」この事業が必要なのか（社会的な背景や統計データ）\n- なぜ「他の誰でもなく、私たちの団体が」やるべきなのか（団体の実績や独自性）\n- この事業が成功すると、地域や社会にどのようなポジティブな変化が生まれるのか（インパクト）\n\nこれらの論点を盛り込み、説得力のある文章を作成してください。",
                    hint: "申請先の助成財団が重視している価値観や過去の採択事例を調べ、その方向性に沿ったアピールポイントを盛り込むと効果的です。"
                },
                {
                    type: "default",
                    title: "クラウドファンディングの魅力的なリターンを考える",
                    description: "支援者が「応援したい！」と感じるような、ユニークで魅力的なクラウドファンディングのリターン（返礼品）のアイデアを出します。",
                    prompt: "私たちは「[例：子どもたちが安心して過ごせる居場所を作る]」というプロジェクトのために、クラウドファンディングに挑戦します。目標金額は[100万円]です。\n\n# プロジェクト概要\n- [プロジェクトの簡単な説明]\n\n# ターゲット支援者層\n- [例：子育て世代、地域の企業、団体の活動に関心のある人々]\n\n上記を踏まえ、3,000円、5,000円、10,000円、30,000円、100,000円の支援コースごとに、活動の魅力が伝わり、かつ団体の負担になりすぎないリターンのアイデアを5つずつ提案してください。単なるモノだけでなく、特別な「体験」や「権利」なども含めてください。",
                    hint: "団体の活動内容に関連するリターン（例：活動体験会への招待、成果報告書への名前掲載）や、団体の世界観が伝わるオリジナルグッズなどを考えると、より共感を呼びやすくなります。"
                },
                {
                    type: "default",
                    title: "心を動かす寄付のお願い（ウェブサイト・SNS用）",
                    description: "ウェブサイトやSNSに掲載し、多くの人から共感を得て寄付を集めるための、ストーリー性のある文章を作成します。",
                    prompt: "私たちの団体は「[活動内容]」を行っています。この活動を継続していくために、個人からの寄付を募るウェブサイト用の文章を作成してください。\n\n# 含めてほしい要素\n- 具体的な受益者のストーリー（個人情報に配慮した上で）\n- なぜ寄付が必要なのか（具体的な資金使途）\n- 寄付がもたらす変化（例：3,000円の寄付で、子ども1人に1ヶ月分の食事を提供できます）\n- 寄付者への感謝のメッセージ\n\n団体の想いが伝わる、誠実で心に響く文章をお願いします。",
                    hint: "団体の代表者やスタッフの顔が見えるような、個人的なメッセージを加えると、信頼感や共感性が高まります。"
                },
                {
                    type: "default",
                    title: "企業向け協賛（スポンサー）提案書の骨子作成",
                    description: "地域の企業に活動のスポンサーになってもらうための提案書の骨子を作成します。企業のメリットも明確に提示し、Win-Winの関係を築きます。",
                    prompt: "私たちの団体は、[イベント名や事業名]への協賛を地域の企業にお願いしたいと考えています。企業のCSR担当者に響くような、協賛提案書の骨子を作成してください。\n\n# 提案先に想定している企業\n- [例：地域の食品スーパー、工務店など]\n\n# 提案書に含める内容\n- 団体の紹介と活動実績\n- 協賛をお願いする事業の概要と社会的意義\n- 協賛金の使い道\n- 協賛企業へのメリット（例：ウェブサイトへのロゴ掲載、イベントでの企業名紹介、地域貢献企業としてのイメージ向上など）\n- 協賛プラン（例：ゴールド:10万円、シルバー:5万円など）\n\n企業の社会的責任(CSR)活動に繋がる点を強調してください。",
                    hint: "提案先企業の事業内容や理念を調べ、「なぜ、この企業にお願いしたいのか」という理由を明確に伝えることが重要です。"
                },
                {
                    type: "default",

                    prompt: "私たちの団体では、ボランティアの協力のもと、[活動報告書]や[ウェブサイトの記事]、[イベントのポスター]などを制作しています。これらの制作物の著作権は、団体、それとも制作したボランティア個人に帰属するのでしょうか？\n\n- 著作権の帰属について、事前に取り決めておくべきことはありますか？（覚書や契約書など）\n- 他の団体の制作物を参考にする際に、著作権侵害にならないための注意点は何ですか？\n- 私たちの制作物を、他の人に無断で使われないようにするためにはどうすればよいですか？",
                    hint: "写真やイラスト、文章など、具体的な制作物の種類を挙げて質問すると、より的確な回答が得られます。"
                },
                {
                    type: "default",
                    title: "労務相談：有償スタッフの雇用と社会保険・雇用保険",
                    description: "有償スタッフを雇用する際に必要となる、社会保険（健康保険・厚生年金）や雇用保険の加入手続きについて確認します。",
                    prompt: "私たちのNPO法人で、初めて月給[15万円]、週[30時間]勤務の有償スタッフを雇用します。この場合、社会保険や雇用保険への加入は義務でしょうか？\n\n- 加入が義務となる条件（労働時間、日数など）を教えてください。\n- 加入手続きは、どこで、どのように行えばよいですか？（必要な書類、届出先など）\n- 保険料は、団体とスタッフでそれぞれ、どのくらいの負担になりますか？\n\n手続きの全体像がわかるように、ステップバイステップで説明してください。",
                    hint: "法人の形態（NPO法人か任意団体か）や、雇用するスタッフの具体的な労働条件を詳しく伝えることが重要です。"
                },
                {
                    type: "default",
                    title: "労務相談：理事への報酬支払いは可能か？",
                    description: "理事長や常勤の理事が、その働きに対して「役員報酬」や「給与」を受け取ることができるのか、その条件と注意点を確認します。",
                    prompt: "私たちのNPO法人では、理事長が常勤で団体の運営を担っています。その働きに対して、団体から報酬を支払うことは可能でしょうか？\n\n- 「役員報酬」と「職員給与」の違いは何ですか？\n- 理事が報酬や給与を受け取るために、定款や総会で定めておくべきことは何ですか？\n- 報酬額を決定する際に、注意すべき点はありますか？（不当に高額でないかなど）\n\nNPO法上のルールや税務上の注意点を含めて、分かりやすく解説してください。",
                    hint: "対象となる理事の具体的な業務内容や拘束時間を伝えることで、それが「役員としての業務」なのか「職員としての労働」なのかを判断するヒントが得られます。"
                }
            ],
            "⑧戦略的な壁打ち": [
                {
                    type: "default",
                    title: "組織内の意見対立の解決策を探る（壁打ち）",
                    description: "活動方針などで意見が分かれた際に、第三者の視点から論点を整理し、建設的な解決策を見つけるための思考のパートナーになります。",
                    prompt: "私はNPO法人の理事をしています。現在、今後の活動方針について、理事の間で意見が対立しており、議論が停滞しています。\n\n# 対立している意見\n- A意見：[例：これまでの地域に根差した活動を堅実に続けるべきだ]\n- B意見：[例：オンラインを活用して、もっと広範囲に活動を拡大すべきだ]\n\n# あなたへの依頼\n第三者の客観的な視点から、この状況を打開するための「壁打ち」相手になってください。以下の問いを投げかけ、私の思考を整理する手助けをしてください。\n- それぞれの意見の背景にある「想い」や「懸念」は何か？\n- 両方の意見の「良いとこ取り」はできないか？\n- 議論の前提となっている「思い込み」はないか？\n- この対立を、団体が成長する「機会」と捉えるには？",
                    hint: "Geminiを単なる回答生成AIとしてではなく、思考を深めるための「コーチ」や「ファシリテーター」として活用するプロンプトです。あなた自身の考えを率直にぶつけることで、思わぬ気づきが得られることがあります。"
                },
                {
                    type: "default",
                    title: "新規事業のアイデアがメンバーに反対された時の説得戦略",
                    description: "新しい挑戦に対する不安や反対意見を乗り越え、メンバーの協力を得て事業を前に進めるためのコミュニケーション戦略を考えます。",
                    prompt: "私は「[例：子ども食堂の宅配サービス]」という新規事業を提案しましたが、他のメンバーから「[例：手間がかかりすぎる、既存の活動がおろそかになる]」といった理由で反対されています。\n\nこの状況を打開し、メンバーに事業の重要性を理解してもらい、協力してもらうための説得戦略を一緒に考えてください。\n\n# 思考のステップ\n1.  反対意見の背景にある、メンバーの本当の懸念や不安を分析する。\n2.  その懸念を払拭するための具体的なデータや情報、対策を整理する。\n3.  事業のメリットを、メンバーそれぞれの関心事に結びつけて説明する方法を考える。\n4.  まずは小さく試す「テスト導入」を提案するなど、合意形成のための現実的な落としどころを探る。",
                    hint: "反対しているメンバーの意見を否定せず、一度受け止めた上で、「その懸念はもっともです。その上で、このような対策はどうでしょうか？」と提案する姿勢が重要です。"
                },
                {
                    type: "default",
                    title: "もし主要な財源がなくなったら？（シナリオプランニング）",
                    description: "団体の存続を脅かす危機を想定し、今から備えておくべきことを考えるための思考実験（壁打ち）です。",
                    prompt: "私たちの団体は、年間予算[500万円]のうち、[約60%]を[〇〇財団からの助成金]に依存しています。もし、来年度からこの助成金が打ち切られたら、という最悪のシナリオを想定して、思考の壁打ち相手になってください。\n\n# 問いかけてほしいこと\n- まず、何から手をつけるべきか？（事業の優先順位付け）\n- 代替となる新たな財源の可能性はどこにあるか？（アイデアのブレスト）\n- 組織のスリム化や、他団体との連携で乗り切ることはできないか？\n- この危機を、団体の体質を強化するチャンスと捉えるには？\n\n私たちがパニックにならず、冷静に次の一手を考えるための問いを投げかけてください。",
                    hint: "これはあくまで思考実験です。悲観的になりすぎず、ポジティブな発想の転換を促すような問いかけをAIにお願いしてみましょう。"
                },
                {
                    type: "default",
                    title: "事業の「出口戦略」を考える（壁打ち）",
                    description: "始めた事業をいつ、どのように終えるか、または次の世代に引き継ぐか。持続可能な組織であるための「終わり方」を考えます。",
                    prompt: "私たちの団体で[10年間]続けてきた「[事業名]」について、今後のあり方を検討しています。社会の状況も変わり、当初の目的はある程度達成できたように感じています。\n\nこの事業の「出口戦略」について、壁打ち相手になってください。\n\n# 選択肢\n1.  事業を完全に終了する（発展的解消）\n2.  事業の規模を縮小して継続する\n3.  他の団体や行政に事業を引き継ぐ\n4.  事業内容をリニューアルして新たな価値を創造する\n\nそれぞれの選択肢のメリット・デメリットを整理し、私たちが最も良い決断を下せるよう、思考を整理する手伝いをしてください。",
                    hint: "事業の成果だけでなく、関わってきたメンバーや受益者の「想い」をどのように受け止めるか、という視点も重要です。"
                },
                {
                    type: "default",
                    title: "自分たちでは気づかない「団体の本当の価値」を探る（壁打ち）",
                    description: "日々の活動に追われる中で見失いがちな、自分たちの活動の独自性や社会的価値を再発見するための壁打ちです。",
                    prompt: "私たちは「[活動内容]」を長年続けていますが、最近、活動がマンネリ化しているように感じています。第三者の視点から、私たちがまだ気づいていないかもしれない「団体の本当の価値」や「隠れた強み」を見つける手伝いをしてください。\n\n# 私たちの情報\n- 活動内容：[具体的な活動内容]\n- メンバーの声：「[例：もっと社会に影響を与えたいが、方法がわからない]」\n- 受益者の声：「[例：ここに来るとホッとする]」\n\n# 問いかけてほしいこと\n- あなたたちの活動は、他の類似団体と何が違うのか？\n- 受益者は、あなたたちの活動の「何」に価値を感じているのか？（提供しているサービスそのもの？それとも場の雰囲気？）\n- その「本当の価値」を、もっと社会に広めるにはどうすればいいか？\n\n私たちの視野を広げるような、鋭い質問を期待しています。",
                    hint: "普段当たり前だと思ってやっていること（例：会議の始めの雑談、手作りのニュースレター）にこそ、団体の独自性が隠れているかもしれません。"
                }
            ]
        };

        const categoryMenu = document.getElementById('category-menu');
        const promptContainer = document.getElementById('prompt-container');
        const toast = document.getElementById('toast');
        

        function renderPrompts(category) {
            promptContainer.innerHTML = '';
            const categoryPrompts = prompts[category] || [];

            const header = document.createElement('div');
            header.className = 'mb-8 fade-in';
            header.innerHTML = `<h2 class="text-3xl font-bold text-slate-800">${category}</h2>`;
            promptContainer.appendChild(header);

            categoryPrompts.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-lg shadow-md mb-6 fade-in';
                card.style.animationDelay = `${index * 100}ms`;

                const promptContent = p.prompt ? `
                    <div class="mt-4 bg-slate-100 p-4 rounded-md">
                        <p class="text-slate-600 whitespace-pre-wrap font-mono text-sm">${p.prompt}</p>
                    </div>` : '';
                
                const hintContent = p.hint ? `
                    <div class="mt-4 bg-indigo-50 p-3 rounded-md prompt-hint">
                        <h4 class="font-semibold text-sm text-indigo-700">💡 良い結果を得るためのヒント</h4>
                        <p class="text-sm text-indigo-600 mt-1">${p.hint}</p>
                    </div>` : '';

                const buttons = p.prompt ? `
                    <div class="mt-4 text-right">
                        <button class="copy-btn bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300 text-sm flex items-center justify-center gap-2" data-prompt="${p.prompt}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
                            <span>このプロンプトをコピー</span>
                        </button>
                    </div>` : '';

                card.innerHTML = `
                    <h3 class="text-xl font-semibold text-slate-700">${index + 1}. ${p.title}</h3>
                    <p class="mt-2 text-slate-600">${p.description}</p>
                    ${promptContent}
                    ${hintContent}
                    ${buttons}
                `;
                promptContainer.appendChild(card);
            });
        }

        function showToast() {
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        function init() {
            const categories = Object.keys(prompts);
            let activeCategory = categories[0];

            // --- Render Category Menu ---
            categoryMenu.innerHTML = ''; // Clear existing menu
            categories.forEach(category => {
                const li = document.createElement('li');
                const button = document.createElement('button');
                button.textContent = category;
                button.className = 'w-full text-left px-3 py-2 rounded-lg transition duration-200 text-slate-600 hover:bg-slate-100';
                if (category === activeCategory) {
                    button.classList.add('bg-indigo-100', 'text-indigo-700', 'font-semibold');
                    button.classList.remove('text-slate-600');
                }

                button.addEventListener('click', () => {
                    activeCategory = category;
                    document.querySelectorAll('#category-menu button').forEach(btn => {
                        btn.classList.remove('bg-indigo-100', 'text-indigo-700', 'font-semibold');
                        btn.classList.add('text-slate-600');
                    });
                    button.classList.add('bg-indigo-100', 'text-indigo-700', 'font-semibold');
                    button.classList.remove('text-slate-600');
                    renderPrompts(category);
                });
                li.appendChild(button);
                categoryMenu.appendChild(li);
            });

            // --- Initial Render ---
            renderPrompts(activeCategory);

            // --- Event Delegation for Buttons ---
            document.body.addEventListener('click', e => {
                // Copy Button
                if (e.target.closest('.copy-btn')) {
                    const button = e.target.closest('.copy-btn');
                    const textToCopy = button.dataset.prompt;
                    
                    if (textToCopy) {
                        const textarea = document.createElement('textarea');
                        textarea.value = textToCopy;
                        document.body.appendChild(textarea);
                        textarea.select();
                        try {
                            document.execCommand('copy');
                            showToast();
                        } catch (err) {
                            console.error('Failed to copy text: ', err);
                        }
                        document.body.removeChild(textarea);
                    }
                }
            });
        }

        // --- Start the application ---
        init();
    </script>

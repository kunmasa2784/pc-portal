    <script>

                        <p class="mb-6 text-slate-600">AIをビジネスの「単なるアシスタント」から「戦略的パートナー」へと進化させるための、実践的なプロンプト集です。AIのポテンシャルを最大限に引き出し、業務の質と速度を飛躍的に向上させましょう。</p>
                        <h3 class="text-2xl font-bold mb-4 text-slate-700">成果を出すビジネスプロンプトの3原則</h3>

                            <div class="bg-amber-100 p-4 rounded-lg">
                                <div class="text-3xl mb-2">🎯</div>

                                <div class="text-3xl mb-2">📋</div>
                                <h4 class="font-bold text-emerald-800">3. 思考の型と形式を指定する</h4>
                                <p class="text-sm text-emerald-700">「SWOT分析のフレームワークで」「表形式で」のように指定し、構造化された回答を得ます。</p>

            {

                    {

                        prompt: `あなたは一流の経営コンサルタントです。日本の「フードデリバリー市場」について、以下のフレームワークを用いて分析し、我々（中堅の食品メーカー）が参入すべき新たな事業機会を3つ提案してください。\n\n* **使用するフレームワーク:** PEST分析（政治、経済、社会、技術）、3C分析（市場・顧客、競合、自社）\n* **自社の強み:** 全国規模の物流網、高品質な冷凍食品の開発力\n* **提案の条件:** 初期投資が比較的少なく、既存の強みを活かせるもの\n* **出力形式:** 各分析の結果を要約し、その上で具体的な事業機会とその根拠を提示してください。`,

                    {

                        point: '定性的な生データをAIに与え、構造化されたインサイトを抽出させる強力な手法です。具体的なアウトプット形式を指定することで、単なる感想の羅列から、開発チームがすぐに行動に移せるような示唆に富んだレポートを作成させることができます。'
                    }

                        point: '大量のデータや文章を貼り付け、「要約して」と頼むだけでなく、「重要なポイント」と「アクションへの示唆」を求めるのが鍵です。これにより、AIは単なる情報整理に留まらず、データに基づいた意思決定をサポートするビジネスインサイトを生成します。'
                    },
                    {
                        subtitle: 'KPIダッシュボードの設計',
                        prompt: `あなたはBIコンサルタントです。営業部門が利用するKPIダッシュボードを設計してください。ダッシュボードに表示すべき主要なKPIと、それを可視化するのに最適なグラフの種類を提案してください。\n\n* **目的:** 営業活動の進捗をリアルタイムで把握し、迅速な意思決定を促す\n* **主要ユーザー:** 営業部長、営業担当者\n* **出力形式:** 表形式で、以下の項目を含めてください。\n    * KPI名 (例: 売上達成率、新規顧客獲得数)\n    * KPIの定義\n    * 最適なグラフの種類 (例: ゲージチャート、棒グラフ)\n    * そのグラフで見るべきポイント`,
                        point: 'プロジェクトの「目的」と「ユーザー」を明確にすることで、誰にとって何が重要なのかをAIに理解させることができます。KPIだけでなく、それを「どう見せるか（グラフ）」、「どう見るか（ポイント）」まで含めて質問することで、思考が深まり、実用的な設計図が完成します。'
                    }

            },
            {
                id: 'hr',
                title: '5. 人事・チームマネジメント',
                category: '人事・チームマネジメント',
                isCategory: true,
                examples: [
                    {
                        subtitle: '面接質問の作成',
                        prompt: `あなたはIT企業の採用責任者です。今回募集する「Webアプリケーション開発エンジニア（中途採用）」のポジションについて、候補者の技術力、問題解決能力、そしてカルチャーフィットを見極めるための面接質問を10個作成してください。\n\n* **求める人物像:** 自律的に課題を発見し、チームと協力して解決できる人物。新しい技術への学習意欲が高い。\n* **質問の分類:**\n    * 技術スキルに関する質問（3問）\n    * 過去の経験に関する行動ベースの質問（4問）\n    * 価値観や志向性に関する質問（3問）\n* **出力:** 各質問と、その質問によって何を確認したいのか（評価ポイント）をセットで記述してください。`,
                        point: '「求める人物像」を具体的に言語化し、質問を「分類」させることで、場当たり的ではない、構造化された面接が設計できます。「評価ポイント」までセットで出力させることで、面接官ごとの評価のブレを減らし、より客観的な採用判断が可能になります。'

                    {
                        subtitle: '1on1ミーティングのアジェンダ作成',
                        prompt: `あなたは経験豊富なマネージャーです。部下との週次の1on1ミーティングで使う、効果的なアジェンダのテンプレートを作成してください。\n\n* **目的:** 部下の成長支援、課題の早期発見、エンゲージメント向上\n* **構成要素:**\n    * チェックイン（心身の健康状態や最近の様子の確認）\n    * 先週の振り返り（進捗、うまくいったこと、課題）\n    * 今週の優先事項の確認\n    * 課題や相談事項のディスカッション\n    * 中長期的なキャリアや成長に関する対話\n    * ネクストステップの確認\n* **出力:** 各項目でマネージャーが投げかけるべき具体的な質問例も添えてください。`,
                        point: '目的と構成要素を明確にすることで、形骸化しがちな1on1を、意味のある対話の場に変えるための具体的なツールを作成できます。「具体的な質問例」まで求めると、すぐに実践で使える質の高いアウトプットが得られます。'
                    }

            },
            {

                        prompt: `あなたは経験豊富なカスタマーサポートのリーダーです。以下の顧客からのクレームメールに対して、共感を示しつつ、誠実に対応するための返信メールの草案を作成してください。\n\n* **顧客からのメール:**\n    「先日購入した製品が、説明書通りに動かない。何度も試したが改善しない。すぐに交換してほしい。」\n\n* **返信メールに含めるべき要素:**\n    1.  謝罪と共感の表明\n    2.  状況をより詳しくヒアリングするための質問（具体的な症状など）\n    3.  今後の対応策の提示（代替品の送付手続きなど）\n    4.  問い合わせへの感謝\n* **トーン:** 丁寧かつ迅速な対応を印象付ける、プロフェッショナルなトーンで。`,
